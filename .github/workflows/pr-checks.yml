name: PR Checks

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]

# Cancel superseded runs to save CI minutes when a PR is force-pushed.
concurrency:
    group: pr-checks-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend-typecheck:
        name: Backend Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Install backend dependencies
              working-directory: backend
              run: npm ci

            # Prisma client must be generated before tsc, otherwise the
            # generated types in node_modules/.prisma/client are missing
            # and ~500 cascading "implicit any" errors appear.
            - name: Generate Prisma client
              working-directory: backend
              run: npx prisma generate

            - name: Type-check backend
              working-directory: backend
              run: npm run build

    backend-tests:
        name: Backend Tests
        runs-on: ubuntu-latest
        env:
            # Some modules side-effect on import and validate required runtime
            # secrets (encryption key, session secret). Provide deterministic
            # CI-only defaults so unit tests can import them without crashing.
            NODE_ENV: test
            SETTINGS_ENCRYPTION_KEY: test-ci-encryption-key-not-used-in-production
            SESSION_SECRET: test-ci-session-secret-not-used-in-production
            DATABASE_URL: postgresql://lidify:lidify@localhost:5432/lidify
            REDIS_URL: redis://localhost:6379
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Install backend dependencies
              working-directory: backend
              run: npm ci

            - name: Generate Prisma client
              working-directory: backend
              run: npx prisma generate

            - name: Run backend unit tests
              working-directory: backend
              run: npm test -- --passWithNoTests

    lint-frontend:
        name: Lint Frontend (ESLint + jsx-a11y)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci

            - name: Run ESLint on frontend (includes jsx-a11y as warnings; see adr/0006)
              working-directory: frontend
              run: npm run lint

    typecheck-frontend:
        name: Frontend Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci

            - name: Type-check frontend
              working-directory: frontend
              run: npx tsc --noEmit

    build-docker:
        name: Docker Build Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image (no push)
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: false
                  tags: lidifin:pr-check
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
