services:
  lidifin:
    # Use pre-built image from Docker Hub (OPTION B: remove "build" and keep this)
    image: jamzercise/lidifin:latest
    # Build from GitHub (OPTION A: keep this; image above tags the result for optional push)
    build:
      context: https://github.com/jamzercise/lidifin.git
      dockerfile: Dockerfile
    container_name: lidifin-player
    volumes:
      - /path/to/your/music:/music
      # this is to your Jellyfin data/downloads folder
      - /path/to/lidifin/data:/data
      - /path/to/lidifin/data/postgres:/data/postgres
    ports:
      - 31013:3030
    environment:
      - TZ=America/Los_Angeles
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Internal API secret (backend ↔ CLAP vibe worker); set in production for security
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      # Jellyfin (Lidifin): optional override for API key when using Jellyfin as music source
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      # Lidarr webhook callback URL - how Lidarr reaches Lidify when downloads complete
      # Default uses host.docker.internal which works on most setups with extra_hosts below
      # Override if using custom Docker networks: e.g., http://192.168.0.20:31013
      - LIDIFY_CALLBACK_URL=${LIDIFY_CALLBACK_URL:-}
      # Required for Lidarr webhook integration on Linux
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
volumes:
  lidifin_data: null
networks: {}
